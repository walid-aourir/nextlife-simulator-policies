<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Life Ai Simulator - Legal & Policies</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: rgba(31, 40, 51, 0.7);
            --accent: #66fcf1;
            --accent-dim: #45a29e;
            --text-main: #ffffff;
            --text-muted: #c5c6c7;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, rgba(69, 162, 158, 0.15), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(102, 252, 241, 0.1), transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 800px;
            margin: 4rem auto;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #ffffff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 3rem;
        }
        .nav-links {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }
        @media (min-width: 600px) {
            .nav-links {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .card:hover {
            transform: translateY(-5px);
            background: rgba(102, 252, 241, 0.05);
            border-color: var(--accent-dim);
            box-shadow: 0 10px 20px rgba(69, 162, 158, 0.1);
        }
        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .card-title {
            font-weight: 600;
            font-size: 1.2rem;
        }
        footer {
            margin-top: auto;
            padding: 2rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Next Life Ai Simulator</h1>
        <p class="subtitle">Official Legal & Support Documentation</p>
        
        <div class="nav-links">
            <a href="privacy.html" class="card">
                <div class="card-icon">🛡️</div>
                <div class="card-title">Privacy Policy</div>
            </a>
            <a href="terms.html" class="card">
                <div class="card-icon">⚖️</div>
                <div class="card-title">Terms of Use</div>
            </a>
            <a href="contact.html" class="card">
                <div class="card-icon">✉️</div>
                <div class="card-title">Contact Us</div>
            </a>
        </div>
    </div>
    
    <footer>
        &copy; 2024 Next Life Ai Simulator. All rights reserved.
    </footer>
</body>
</html>
